{% extends 'hbase.html' %}
{% block Homeowner%}
<div class="row">
    <div class="col-sm-12 text-center">
        <h1 class="text-warning">
            ADD YOUR PROJECT
        </h1>
    </div>
    <div class="col-sm-12 col-md-7 mx-auto p-3 mt-3 border rounded shadow ">
        <form method="post" class="fw-semibold">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit" class="btn btn-warning w-100 mx-auto">Add Project</button>

        </form>
    </div>
</div>
{% endblock %}
