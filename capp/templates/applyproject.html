{% extends 'cbase.html' %}

{% block contractor %}
<div class="row">
    <div class="col-sm-12">
        <h1>Project Application</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="proposal" class="form-laber">Proposal Text</label>
                <textarea name="proposal_text" id="proposal" class="form-control"></textarea>
            </div>
            <div class="mb-3">
                <label for="file" class="form-laber">Upload Design File</label>
                <input type="file" name="design_file" id="file" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="budget" class="form-laber">Estimated Budget</label>
                <input type="number" step="0.01" name="estimated_budget" id="budget" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="duration" class="form-laber">Estimated Duration</label>
                <input type="number" name="estimated_duration" id="duration" class="form-control" required>
            </div>
            <div class="text-center">
                 <button type="submit" class="btn btn-warning w-25">Submit</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
